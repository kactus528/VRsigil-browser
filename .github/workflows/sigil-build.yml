# Builds the Sigil Trigger version of Wolvic for Meta Quest and attaches the APK
# to the run (Actions tab → latest run → Artifacts).

name: Sigil Trigger Quest build

on:
  push:
    branches: [ main, sigil-trigger ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install as a separate app from regular Wolvic
        run: echo "simultaneousDevProduction=true" > user.properties

      - name: Build Quest APK
        run: ./gradlew assembleOculusvrArm64GeckoGenericDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sigil-trigger-quest-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish as the "latest" release (plain APK download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" sigil-trigger-browser.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sigil-trigger-browser.apk \
            --title "Sigil Trigger browser (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Sideload onto the Quest with SideQuest or Bugjaeger." \
            --target ${{ github.sha }}
